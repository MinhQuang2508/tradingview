<!doctype html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vietnam Market Pulse — VNINDEX, định giá và thanh khoản</title>
<meta name="description" content="Biểu đồ tổng hợp VNINDEX, P/E, USD/VND, lãi suất liên ngân hàng và hoạt động bơm hút thanh khoản của NHNN.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23080b11'/><path d='M5 22 L12 14 L18 19 L27 8' stroke='%233987e5' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/><path d='M5 27 L12 24 L18 25 L27 20' stroke='%23d95926' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
<link rel="stylesheet" href="css/app.css">
<script src="vendor/lightweight-charts.js"></script>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark" aria-hidden="true"></span>
    <span class="brand-name">VIETNAM&nbsp;MARKET&nbsp;PULSE</span>
    <span class="brand-sub" id="brandSub"></span>
  </div>

  <nav class="ws" id="wsSeg" role="group" aria-label="Bộ dữ liệu"></nav>

  <span class="sep"></span>
  <div class="seg" id="rangeSeg" role="group"></div>

  <span class="sep"></span>
  <div class="seg" id="viewSeg" role="group"></div>
  <div class="seg" id="metricSeg" role="group"></div>

  <button class="btn btn-icon" id="btnFit" title="Auto fit thời gian và price scale">⤢</button>

  <div class="spacer"></div>

  <div class="status" id="status">
    <span class="dot" aria-hidden="true"></span>
    <span id="statusText"></span><span id="statusTime"></span>
  </div>
  <span class="sep"></span>
  <button class="btn" id="langBtn">EN</button>
  <button class="btn btn-icon" id="themeBtn">◐</button>
</header>

<div class="readout" id="readout"></div>

<div class="workspace">
  <main class="chart-area">
    <div id="chart"></div>
    <div class="chart-foot">
      <span class="legend-inline" id="legend"></span>
      <span class="note" id="chartNote"></span>
    </div>
  </main>

  <aside class="sidebar">
    <nav class="tabs">
      <button class="tab active" data-tab="data"></button>
      <button class="tab" data-tab="stats"></button>
      <button class="tab" data-tab="about"></button>
    </nav>

    <section class="pane active" id="pane-data">
      <div class="filters">
        <div class="seg" id="quickSeg" role="group"></div>
        <label class="field"><span id="lblFrom"></span>
          <input type="date" class="input" id="fromDate"></label>
        <label class="field"><span id="lblTo"></span>
          <input type="date" class="input" id="toDate"></label>
        <button class="btn" id="btnReset"></button>
        <button class="btn" id="btnCsv"></button>
      </div>
      <div class="rowcount num" id="rowCount"></div>
      <div class="tablewrap">
        <table>
          <thead id="tblHead"></thead>
          <tbody id="tblBody"></tbody>
        </table>
      </div>
    </section>

    <section class="pane" id="pane-stats"></section>
    <section class="pane" id="pane-about"></section>
  </aside>
</div>

<div id="toast" class="toast hidden"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
