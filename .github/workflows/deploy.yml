# Deploy trang lên GitHub Pages.
#
# Dữ liệu chính do máy chủ nội bộ đẩy lên (nó gọi API Vietcap được ổn định).
# Lịch chạy dưới đây chỉ là dự phòng: nếu máy đó tắt, Actions tự thử tải lại.
# Bước tải để continue-on-error — Vietcap có thể chặn IP của runner, khi đó vẫn
# deploy bằng dữ liệu đã commit thay vì hỏng cả lần chạy.
name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '20 10 * * 1-5'   # 17:20 giờ Việt Nam, sau khi phiên đã chốt
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Tải lại dữ liệu (dự phòng)
        if: github.event_name != 'push'
        continue-on-error: true
        run: |
          python3 scripts/fetch_data.py
          python3 scripts/fetch_fx.py

      - name: Commit nếu dữ liệu đổi
        if: github.event_name != 'push'
        continue-on-error: true
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add site/data/
          git diff --cached --quiet || {
            git commit -m "Cập nhật dữ liệu $(date -u +%d/%m/%Y)"
            git push
          }

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
