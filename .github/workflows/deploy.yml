# Deploy trang lên GitHub Pages.
#
# Dữ liệu chính do máy chủ nội bộ đẩy lên (nó gọi API Vietcap được ổn định).
# Lịch chạy dưới đây chỉ là dự phòng: nếu máy đó tắt, Actions tự thử tải lại.
# Bước tải để continue-on-error — Vietcap có thể chặn IP của runner, khi đó vẫn
# deploy bằng dữ liệu đã commit thay vì hỏng cả lần chạy.
name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '20 10 * * 1-5'   # 17:20 giờ Việt Nam, sau khi phiên đã chốt
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Lịch dự phòng: chỉ dùng khi máy chủ nội bộ tắt. Nếu VNDirect chặn IP
      # runner thì lần tải có thể thiếu phiên, làm chuỗi ngắn đi — nên phải so
      # với bản đã commit trước khi ghi đè, thà giữ dữ liệu cũ còn hơn đăng bản
      # khuyết.
      - name: Tải lại dữ liệu (dự phòng)
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          VIETDATAVERSE_API_KEY: ${{ secrets.VIETDATAVERSE_API_KEY }}
        run: |
          cp site/data/vnindex_pe.json /tmp/pe_truoc.json
          cp site/data/fx.json /tmp/fx_truoc.json
          cp site/data/interbank.json /tmp/interbank_truoc.json
          python3 scripts/fetch_data.py
          python3 scripts/fetch_fx.py
          python3 scripts/fetch_interbank.py
          python3 - <<'EOF'
          import json, shutil, sys
          def n_pe(p):
              s = json.load(open(p))['series']
              return len(s), sum(1 for r in s if 'pe' in r)
          for moi, cu in (('site/data/vnindex_pe.json', '/tmp/pe_truoc.json'),
                          ('site/data/fx.json', '/tmp/fx_truoc.json'),
                          ('site/data/interbank.json', '/tmp/interbank_truoc.json')):
              a, b = n_pe(moi), n_pe(cu)
              if a[0] < b[0] * 0.98 or a[1] < b[1] * 0.98:
                  print(f"::warning::{moi} ngắn đi ({a} < {b}) — giữ bản cũ")
                  shutil.copy(cu, moi)
              else:
                  print(f"{moi}: {b} -> {a}")
          EOF

      - name: Commit nếu dữ liệu đổi
        if: github.event_name != 'push'
        continue-on-error: true
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add site/data/
          git diff --cached --quiet || {
            git commit -m "Cập nhật dữ liệu $(date -u +%d/%m/%Y)"
            git push
          }

      # GitHub Pages đặt Cache-Control: max-age=600 cho MỌI file và không cho
      # đổi. Trình duyệt vì thế có thể lấy index.html mới nhưng app.js cũ —
      # đúng lỗi đã gặp: bản cũ tìm #keyIndex vốn đã bị xoá khi tách workspace.
      # Đóng dấu commit SHA vào URL tài nguyên để mỗi lần deploy là một URL mới.
      - name: Đóng dấu phiên bản vào URL tài nguyên
        run: |
          V=${GITHUB_SHA::8}
          sed -i \
            -e "s|href=\"css/app\.css\"|href=\"css/app.css?v=$V\"|" \
            -e "s|src=\"vendor/lightweight-charts\.js\"|src=\"vendor/lightweight-charts.js?v=$V\"|" \
            -e "s|src=\"js/app\.js\"|src=\"js/app.js?v=$V\"|" \
            site/index.html
          sed -i "s|from './\([a-z0-9]*\).js'|from './\1.js?v=$V'|g" site/js/app.js
          echo "— index.html —"; grep -oE '(href|src)="[^"]*\?v=[^"]*"' site/index.html
          echo "— app.js —";     grep -oE "from '\./[^']*'" site/js/app.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
